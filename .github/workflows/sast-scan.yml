name: "sast-scan"

on:
  push:
    branches: [githubcicd]

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --force

      - name: Download OWASP Dependency-Check
        run: |
          wget -q https://github.com/dependency-check/DependencyCheck/releases/download/v13.0.0/dependency-check-13.0.0-release.zip
          unzip -q dependency-check-13.0.0-release.zip -d "$HOME"

      - name: Run OWASP Dependency-Check
        run: |
          chmod +x "$HOME/dependency-check/bin/dependency-check.sh"
          "$HOME/dependency-check/bin/dependency-check.sh" \
            --project "bitcoin" \
            --scan . \
            --format HTML \
            --out . \
            --disableOssIndex \
            --nvdApiKey "$NVD_API_KEY"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Archive SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: dependency-check-report.html
          if-no-files-found: warn